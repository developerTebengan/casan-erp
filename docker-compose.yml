services:
  postgres:
    image: postgres:15-alpine
    container_name: casan-erp-postgres
    environment:
      POSTGRES_USER: casan
      POSTGRES_PASSWORD: casan123
      POSTGRES_DB: casan_erp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U casan -d casan_erp']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
